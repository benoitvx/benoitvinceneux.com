name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro build
      - run: python3 -I -m unittest discover -s tests -v
      - run: npx html-validate "dist/**/*.html"
      - name: Apache local
        run: |
          sudo cp -a dist /var/www/ci
          printf '%s\n' 'Listen 8080' '<VirtualHost *:8080>' '  DocumentRoot /var/www/ci' '  <Directory /var/www/ci>' '    AllowOverride All' '    Require all granted' '  </Directory>' '</VirtualHost>' | sudo tee /etc/apache2/sites-available/ci.conf
          sudo a2ensite ci
          sudo a2enmod rewrite headers
          sudo apachectl configtest
          sudo apachectl restart
      - run: bash tests/http_check.sh
        env:
          BASE_URL: http://127.0.0.1:8080
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro build
      - name: Garde-fous avant mise en ligne
        run: bash tests/predeploy_guard.sh dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy dist/
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: rsync -rtlz --delete-after --delay-updates dist/ "$DEPLOY_TARGET"

      # Smoke T-BV-SMK-01 : dernière étape, le site est déjà en ligne. Rouge = signal, rollback manuel (README).
      - name: Smoke après mise en ligne
        run: bash tests/http_check.sh
        env:
          BASE_URL: https://benoitvinceneux.com
          HSTS_MIN_AGE: 16000000

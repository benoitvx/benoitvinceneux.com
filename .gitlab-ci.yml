deploy:
  stage: deploy
  only:
    variables:
      - $CI_COMMIT_MESSAGE != 'content_backup'
      - $CI_COMMIT_REF_NAME == 'master'
      
  script:
    - apt-get update -qq && apt-get install -y -qq sshpass rsync
    - sshpass -V
    - export SSHPASS=$PASSWORD
    - rsync -ratlz --rsh="sshpass -p $PASSWORD ssh -o StrictHostKeyChecking=no -l 6c4nf_cd" --exclude benoitvinceneux.com/content/ benoitvinceneux.com 6c4nf.ftp.infomaniak.com:/home/clients/4d2bacdb41356fc6dce1c18e19077c30/sites